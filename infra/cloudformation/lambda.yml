AWSTemplateFormatVersion: "2010-09-09"
Description: Franchise API running as a container image on AWS Lambda behind a Function URL

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI (with tag) built from Dockerfile.lambda
  TableName:
    Type: String
    Default: franchises

Resources:
  # Least privilege: only the data-plane actions the API uses, only on this table.
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: franchises-table-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:ConditionCheckItem
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/franchise-api
      RetentionInDays: 7

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: franchise-api
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures:
        - arm64
      MemorySize: 2048 # Lambda gives CPU proportional to memory; the JVM cold start is CPU-bound
      Timeout: 30
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref TableName
          # Non-HTTP events (the keep-warm schedule) are forwarded to the app as a POST on this path
          AWS_LWA_PASS_THROUGH_PATH: /actuator/health

  # Pings the function every 5 minutes so the JVM stays loaded and users avoid cold starts.
  KeepWarmRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Keeps the Franchise API Lambda warm
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: keep-warm
          Arn: !GetAtt Function.Arn
          Input: '{"source":"keep-warm"}'

  KeepWarmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt KeepWarmRule.Arn

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE

  UrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  UrlInvokeFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: Public base URL of the API
    Value: !GetAtt FunctionUrl.FunctionUrl
