AWSTemplateFormatVersion: "2010-09-09"
Description: Single-table DynamoDB persistence for the Franchise API

Parameters:
  TableName:
    Type: String
    Default: franchises
    Description: Name of the DynamoDB table

Resources:
  FranchisesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  TableName:
    Description: DynamoDB table name
    Value: !Ref FranchisesTable
  TableArn:
    Description: DynamoDB table ARN (used later by the ECS task role)
    Value: !GetAtt FranchisesTable.Arn
