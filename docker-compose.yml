services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: franchise-dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  # One-shot job: creates the table, then exits. The app waits for it to succeed.
  create-table:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do sleep 1; done
        aws dynamodb create-table \
          --endpoint-url http://dynamodb-local:8000 \
          --table-name franchises \
          --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S \
          --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          --no-cli-pager >/dev/null || true
        echo "table ready"
    restart: "no"

  app:
    build: .
    container_name: franchise-api
    depends_on:
      create-table:
        condition: service_completed_successfully
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_TABLE: franchises
      AWS_REGION: us-east-1
    ports:
      - "${APP_PORT:-8080}:8080"
